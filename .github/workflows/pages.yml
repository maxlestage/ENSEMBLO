# Publie le site sur GitHub Pages : les pages rendues par l'app Paquets elle-même
# (`ensemblo-site export`), avec le bundle WebAssembly, derrière le chemin du dépôt
# (https://<propriétaire>.github.io/ENSEMBLO/).
#
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
# Lancé à chaque push sur master, par la fusion automatique (ci.yml), ou à la main.

name: GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Paquets et ses paquets sont dans des dépôts privés : voir ci.yml.
  REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: ${{ secrets.REPOS_TOKEN != '' && 1 || 0 }}
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$REPOS_TOKEN"; }; f'
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Construire le site statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: site
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: wasm-bindgen@0.2.130
      - name: Bundle du navigateur et export
        working-directory: site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cargo build --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --remove-name-section --remove-producers-section \
            --out-dir pkg target/wasm32-unknown-unknown/wasm-release/ensemblo_site.wasm
          cargo run --release -- export ../dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Déployer
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
